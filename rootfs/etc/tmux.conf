# Global tmux config for the devcontainer.
#
# Deliberately small. The point is a session that survives a dropped exec and
# splits cleanly for watching two things at once, not a full config.

set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# Ctrl-a rather than Ctrl-b, since Ctrl-b is usually already taken by the outer
# tmux session on the host.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits that keep the current pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind r source-file /etc/tmux.conf \; display "tmux.conf reloaded"

set -g status-style "bg=colour90,fg=colour255"
set -g status-left "#[bold] devbox #[default] "
set -g status-right "#{?client_prefix,#[reverse]PREFIX#[noreverse] ,}%H:%M "
set -g status-left-length 20
